<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Robots — le jeu BSD classique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f3efe6; --panel: #fffdf8; --text: #20242e; --muted: #6f7482;
    --line: #e4dfd0; --accent: #2563eb; --accent-soft: #dbe7ff;
    --ok: #16a34a; --warn: #ea580c; --bad: #dc2626;
    --btn: #ffffff; --btn-border: #ddd6c4;
  }
  html[data-theme="dark"] {
    --bg: #0e1118; --panel: #161a24; --text: #e9ecf4; --muted: #98a0b3;
    --line: #242a38; --accent: #60a5fa; --accent-soft: #1e2a44;
    --ok: #4ade80; --warn: #fb923c; --bad: #f87171;
    --btn: #1b2130; --btn-border: #2c3446;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100dvh; overflow: hidden; touch-action: manipulation;
  }
  #app { display: flex; flex-direction: column; height: 100%; }
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.2rem; font-weight: 800; letter-spacing: .5px; white-space: nowrap; }
  h1 span { color: var(--accent); }
  #hud { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .stat {
    background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 3px 10px; font-size: .78rem; color: var(--muted); white-space: nowrap;
  }
  .stat b { color: var(--text); font-size: .92rem; margin-left: 5px; font-variant-numeric: tabular-nums; }
  button { font-family: inherit; cursor: pointer; touch-action: manipulation; color: var(--text); }
  #btn-theme {
    background: var(--btn); border: 1px solid var(--btn-border); border-radius: 10px;
    font-size: 1.05rem; padding: 3px 10px; line-height: 1.4;
  }
  main { flex: 1; display: flex; min-height: 0; }
  #board-wrap { flex: 1; position: relative; min-width: 0; min-height: 0; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #banner {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; text-align: center; padding: 0 20px;
  }
  #banner.hidden { display: none; }
  #banner .big {
    font-size: clamp(2rem, 6vw, 3.6rem); font-weight: 800; color: var(--text);
    text-shadow: 0 2px 14px rgba(0,0,0,.35);
  }
  #banner .sub { font-size: clamp(.9rem, 2.4vw, 1.15rem); color: var(--muted); font-weight: 600; }
  #banner .sub b { color: var(--text); }
  #banner.pop .big { animation: pop .5s ease; }
  @keyframes pop {
    0% { transform: scale(.4); opacity: 0; }
    60% { transform: scale(1.15); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  #panel {
    width: 212px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line);
    padding: 10px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto;
  }
  #minimap { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
  #pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #pad button {
    aspect-ratio: 1; font-size: 1.15rem; background: var(--btn);
    border: 1px solid var(--btn-border); border-radius: 10px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1;
  }
  #pad button span { font-size: .58rem; color: var(--muted); }
  #pad button:active, .row button:active { background: var(--accent-soft); }
  #pad .wait { background: var(--accent-soft); font-size: .9rem; }
  .row { display: flex; gap: 6px; }
  .row button {
    flex: 1; background: var(--btn); border: 1px solid var(--btn-border); border-radius: 10px;
    padding: 7px 2px; font-size: .72rem; line-height: 1.3;
  }
  .row button b { display: block; font-size: .88rem; }
  .help { font-size: .68rem; color: var(--muted); line-height: 1.55; }
  .help b { color: var(--text); }
  @media (max-width: 760px) {
    main { flex-direction: column; }
    #board-wrap { min-height: 42vh; }
    #panel {
      width: 100%; border-left: none; border-top: 1px solid var(--line);
      flex-direction: row; flex-wrap: wrap; align-items: flex-start; gap: 8px;
    }
    #minimap { width: 104px; }
    #pad { width: 148px; }
    .row { flex: 1; min-width: 130px; }
    .help { width: 100%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🤖 <span>Robots</span></h1>
    <div id="hud">
      <div class="stat">Niveau<b id="hud-level">1</b></div>
      <div class="stat">Robots<b id="hud-robots">50</b></div>
      <div class="stat">Score<b id="hud-score">0</b></div>
      <div class="stat">Record<b id="hud-record">0</b></div>
      <div class="stat">Risque téléport<b id="hud-risk">0 %</b></div>
      <div class="stat">Bouclier<b id="hud-shield">✔ prêt</b></div>
    </div>
    <button id="btn-theme" type="button" title="Changer de thème">🌙</button>
  </header>
  <main>
    <div id="board-wrap">
      <canvas id="game"></canvas>
      <div id="banner" class="hidden"></div>
    </div>
    <aside id="panel">
      <canvas id="minimap" width="150" height="300"></canvas>
      <div id="pad">
        <button type="button" data-dx="-1" data-dy="-1">↖<span>7</span></button>
        <button type="button" data-dx="0" data-dy="-1">↑<span>8</span></button>
        <button type="button" data-dx="1" data-dy="-1">↗<span>9</span></button>
        <button type="button" data-dx="-1" data-dy="0">←<span>4</span></button>
        <button type="button" data-dx="0" data-dy="0" class="wait">●<span>5</span></button>
        <button type="button" data-dx="1" data-dy="0">→<span>6</span></button>
        <button type="button" data-dx="-1" data-dy="1">↙<span>1</span></button>
        <button type="button" data-dx="0" data-dy="1">↓<span>2</span></button>
        <button type="button" data-dx="1" data-dy="1">↘<span>3</span></button>
      </div>
      <div class="row">
        <button type="button" id="btn-tp"><b>␣ Espace</b>Téléportation</button>
        <button type="button" id="btn-shield"><b>A</b>Bouclier ×1/niv.</button>
        <button type="button" id="btn-replay"><b>↵ Entrée</b>Rejouer</button>
      </div>
      <div class="row">
        <button type="button" id="btn-zoom-out"><b>−</b>Dézoomer</button>
        <button type="button" id="btn-zoom-in"><b>+</b>Zoomer</button>
      </div>
      <p class="help">
        Pavé numérique <b>1-9</b> : se déplacer (diagonales comprises) · <b>5</b> : attendre ·
        <b>Espace</b> : téléportation aléatoire (illimitée) · <b>A</b> : écran protecteur,
        une fois par niveau · <b>+ / −</b> : zoom · <b>Entrée</b> : rejouer après une défaite.
      </p>
    </aside>
  </main>
</div>
<script>
'use strict';

/* ---------- Constantes ---------- */
const GRID_W = 100, GRID_H = 200, TOTAL = GRID_W * GRID_H;
const BASE_CELL = 26;
const RECORD_KEY = 'robots.record.v1';
const THEME_KEY = 'robots.theme';

const THEMES = {
  light: { board:'#f4f1e8', grid:'rgba(32,36,46,0.08)', wreck:'#9aa0aa', wreckDark:'#5f6672',
           robot:'#dc2626', robotDark:'#8f1d1d', player:'#2563eb', playerDark:'#1e40af', view:'#2563eb' },
  dark:  { board:'#10131a', grid:'rgba(233,236,244,0.07)', wreck:'#6b7280', wreckDark:'#a5adbb',
           robot:'#ef4444', robotDark:'#b91c1c', player:'#60a5fa', playerDark:'#3b82f6', view:'#60a5fa' }
};

/* ---------- Éléments ---------- */
const $ = id => document.getElementById(id);
const wrap = $('board-wrap');
const canvas = $('game');
const ctx = canvas.getContext('2d');
const mmap = $('minimap');
const mctx = mmap.getContext('2d');
const banner = $('banner');
const btnTheme = $('btn-theme');
const hud = {
  level: $('hud-level'), robots: $('hud-robots'), score: $('hud-score'),
  record: $('hud-record'), risk: $('hud-risk'), shield: $('hud-shield')
};

/* ---------- État ---------- */
let W = 0, H = 0, dpr = 1;
let theme = 'light';
let zoom = 1;
let cam = { x: GRID_W / 2, y: GRID_H / 2 };
let player = { x: Math.floor(GRID_W / 2), y: Math.floor(GRID_H / 2) };
let robots = [];
let robotSet = new Set();
let wrecks = new Set();
let particles = [];
let shieldWave = null;
let state = 'playing';
let level = 1, score = 0, record = 0;
let shieldAvailable = true;
let bannerToken = 0;

const rand = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const key = (x, y) => x + ',' + y;

/* ---------- Record / thème ---------- */
function loadRecord() {
  try {
    const v = parseInt(localStorage.getItem(RECORD_KEY) || '0', 10);
    record = Number.isFinite(v) && v > 0 ? v : 0;
  } catch (e) { record = 0; }
}
function saveRecord() {
  if (score > record) {
    record = score;
    try { localStorage.setItem(RECORD_KEY, String(record)); } catch (e) {}
  }
}
function applyTheme(t) {
  theme = t === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  btnTheme.textContent = theme === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem(THEME_KEY, theme); } catch (e) {}
}

/* ---------- Bannières ---------- */
function showBanner(html, sticky) {
  bannerToken++;
  banner.innerHTML = html;
  banner.classList.remove('hidden');
  banner.classList.remove('pop');
  void banner.offsetWidth;
  banner.classList.add('pop');
  if (!sticky) {
    const tok = bannerToken;
    setTimeout(() => { if (tok === bannerToken && state === 'playing') hideBanner(); }, 1500);
  }
}
function hideBanner() { banner.classList.add('hidden'); }

/* ---------- HUD ---------- */
function computeRisk() {
  const danger = new Set();
  for (const r of robots) {
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) {
      const x = r.x + dx, y = r.y + dy;
      if (x >= 0 && x < GRID_W && y >= 0 && y < GRID_H) danger.add(key(x, y));
    }
  }
  for (const w of wrecks) danger.add(w);
  return danger.size / TOTAL;
}
function updateHUD() {
  hud.level.textContent = level;
  hud.robots.textContent = robots.length;
  hud.score.textContent = score;
  hud.record.textContent = record;
  hud.shield.textContent = shieldAvailable ? '✔ prêt' : '✖ utilisé';
  hud.shield.style.color = shieldAvailable ? 'var(--ok)' : 'var(--muted)';
  const risk = computeRisk();
  hud.risk.textContent = (risk * 100).toFixed(1) + ' %';
  hud.risk.style.color = risk < 0.05 ? 'var(--ok)' : risk < 0.15 ? 'var(--warn)' : 'var(--bad)';
}

/* ---------- Particules ---------- */
function explosion(cx, cy, colors) {
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 1.5 + Math.random() * 4;
    const life = 0.5 + Math.random() * 0.5;
    particles.push({
      x: cx + 0.5, y: cy + 0.5,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life, max: life,
      color: colors[i % colors.length],
      size: 0.08 + Math.random() * 0.1
    });
  }
}

/* ---------- Niveau ---------- */
function spawnLevel() {
  const count = Math.round(50 * Math.pow(1.2, level - 1));
  robots = [];
  robotSet = new Set();
  const occ = new Set(wrecks);
  occ.add(key(player.x, player.y));
  let guard = 0;
  while (robots.length < count && guard++ < 200000) {
    const x = rand(GRID_W), y = rand(GRID_H);
    if (occ.has(key(x, y))) continue;
    if (Math.max(Math.abs(x - player.x), Math.abs(y - player.y)) < 4) continue;
    occ.add(key(x, y));
    robots.push({ x, y });
    robotSet.add(key(x, y));
  }
  shieldAvailable = true;
}

/* ---------- Règles ---------- */
function robotsTurn() {
  const targets = new Map();
  for (const r of robots) {
    const dx = Math.sign(player.x - r.x);
    const dy = Math.sign(player.y - r.y);
    const k = key(r.x + dx, r.y + dy);
    if (!targets.has(k)) targets.set(k, []);
    targets.get(k).push(r);
  }
  const survivors = [];
  robotSet = new Set();
  for (const [k, list] of targets) {
    const parts = k.split(',');
    const nx = +parts[0], ny = +parts[1];
    const onPlayer = (nx === player.x && ny === player.y);
    if (list.length > 1) {
      score += 10 * list.length;
      explosion(nx, ny, ['#ef4444', '#f97316', '#9ca3af']);
      if (!wrecks.has(k)) wrecks.add(k);
      if (onPlayer) state = 'dead';
    } else if (wrecks.has(k)) {
      score += 10;
      explosion(nx, ny, ['#ef4444', '#9ca3af']);
      if (onPlayer) state = 'dead';
    } else if (onPlayer) {
      state = 'dead';
      explosion(nx, ny, ['#ef4444', '#f97316']);
    } else {
      const r = list[0];
      r.x = nx; r.y = ny;
      survivors.push(r);
      robotSet.add(k);
    }
  }
  robots = survivors;
  saveRecord();
}

function afterAction() {
  if (state !== 'playing') return;
  robotsTurn();
  if (state === 'dead') { gameOver(); return; }
  if (robots.length === 0) { levelClear(); return; }
  updateHUD();
}

function playerMove(dx, dy) {
  if (state !== 'playing') return;
  const nx = clamp(player.x + dx, 0, GRID_W - 1);
  const ny = clamp(player.y + dy, 0, GRID_H - 1);
  player.x = nx; player.y = ny;
  const k = key(nx, ny);
  if (wrecks.has(k) || robotSet.has(k)) {
    state = 'dead';
    explosion(nx, ny, ['#3b82f6', '#ef4444', '#e5e7eb']);
    gameOver();
    return;
  }
  afterAction();
}

function teleport() {
  if (state !== 'playing') return;
  const occ = new Set(wrecks);
  for (const r of robots) occ.add(key(r.x, r.y));
  let x = 0, y = 0, tries = 0, found = false;
  while (tries++ < 5000) {
    x = rand(GRID_W); y = rand(GRID_H);
    if (!occ.has(key(x, y))) { found = true; break; }
  }
  if (!found) {
    outer: for (y = 0; y < GRID_H; y++) for (x = 0; x < GRID_W; x++) {
      if (!occ.has(key(x, y))) break outer;
    }
  }
  explosion(player.x, player.y, ['#3b82f6', '#22d3ee', '#a5b4fc']);
  player.x = x; player.y = y;
  cam.x = x + 0.5; cam.y = y + 0.5;
  explosion(x, y, ['#3b82f6', '#22d3ee', '#a5b4fc']);
  afterAction();
}

function useShield() {
  if (state !== 'playing' || !shieldAvailable) return;
  shieldAvailable = false;
  shieldWave = { start: performance.now(), dur: 650 };
  const kept = [];
  let killed = 0;
  for (const r of robots) {
    if (Math.max(Math.abs(r.x - player.x), Math.abs(r.y - player.y)) <= 1) {
      killed++;
      explosion(r.x, r.y, ['#22d3ee', '#3b82f6', '#e0f2fe']);
    } else {
      kept.push(r);
    }
  }
  robots = kept;
  score += 10 * killed;
  saveRecord();
  afterAction();
}

function gameOver() {
  state = 'dead';
  explosion(player.x, player.y, ['#3b82f6', '#ef4444', '#f97316', '#e5e7eb']);
  saveRecord();
  updateHUD();
  showBanner(
    '<div class="big">Perdu !</div>' +
    '<div class="sub">Score : <b>' + score + '</b> · Record : <b>' + record + '</b></div>' +
    '<div class="sub">Entrée ou « Rejouer » pour recommencer</div>',
    true
  );
}

function levelClear() {
  score += level * 50;
  saveRecord();
  state = 'transition';
  updateHUD();
  showBanner(
    '<div class="big">Niveau ' + (level + 1) + '</div>' +
    '<div class="sub">Bonus de niveau : +' + (level * 50) + ' pts</div>',
    false
  );
  setTimeout(() => {
    if (state !== 'transition') return;
    level++;
    spawnLevel();
    cam.x = player.x + 0.5; cam.y = player.y + 0.5;
    state = 'playing';
    hideBanner();
    updateHUD();
  }, 1600);
}

function reset() {
  score = 0; level = 1;
  wrecks = new Set();
  particles = [];
  shieldWave = null;
  player = { x: Math.floor(GRID_W / 2), y: Math.floor(GRID_H / 2) };
  cam = { x: player.x + 0.5, y: player.y + 0.5 };
  state = 'playing';
  hideBanner();
  spawnLevel();
  updateHUD();
  showBanner('<div class="big">Niveau ' + level + '</div><div class="sub">Éliminez tous les robots !</div>', false);
}

/* ---------- Entrées ---------- */
const MOVES = {
  Numpad7: [-1, -1], Numpad8: [0, -1], Numpad9: [1, -1],
  Numpad4: [-1, 0],  Numpad5: [0, 0],  Numpad6: [1, 0],
  Numpad1: [-1, 1],  Numpad2: [0, 1],  Numpad3: [1, 1],
  Digit7: [-1, -1], Digit8: [0, -1], Digit9: [1, -1],
  Digit4: [-1, 0],  Digit5: [0, 0],  Digit6: [1, 0],
  Digit1: [-1, 1],  Digit2: [0, 1],  Digit3: [1, 1]
};
function setZoom(z) { zoom = clamp(z, 0.3, 5); }

window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const m = MOVES[e.code];
  if (m) { e.preventDefault(); playerMove(m[0], m[1]); return; }
  if (e.code === 'Space') { e.preventDefault(); teleport(); return; }
  if (e.code === 'KeyA') { e.preventDefault(); useShield(); return; }
  if (e.key === 'Enter') { if (state === 'dead') { e.preventDefault(); reset(); } return; }
  if (e.code === 'NumpadAdd' || e.key === '+' || e.key === '=') { e.preventDefault(); setZoom(zoom * 1.25); return; }
  if (e.code === 'NumpadSubtract' || e.key === '-' || e.key === '_') { e.preventDefault(); setZoom(zoom / 1.25); return; }
});

document.querySelectorAll('#pad button').forEach(b => {
  b.addEventListener('click', () => playerMove(parseInt(b.dataset.dx, 10), parseInt(b.dataset.dy, 10)));
});
$('btn-tp').addEventListener('click', teleport);
$('btn-shield').addEventListener('click', useShield);
$('btn-replay').addEventListener('click', reset);
$('btn-zoom-in').addEventListener('click', () => setZoom(zoom * 1.25));
$('btn-zoom-out').addEventListener('click', () => setZoom(zoom / 1.25));
btnTheme.addEventListener('click', () => applyTheme(theme === 'dark' ? 'light' : 'dark'));

/* ---------- Rendu ---------- */
function fit() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  const r = wrap.getBoundingClientRect();
  W = Math.max(50, r.width);
  H = Math.max(50, r.height);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', fit);

function roundRectPath(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawWreck(px, py, cell) {
  const t = THEMES[theme];
  const s = cell * 0.62;
  ctx.fillStyle = t.wreck;
  roundRectPath(ctx, px - s / 2, py - s / 2, s, s, cell * 0.1);
  ctx.fill();
  ctx.strokeStyle = t.wreckDark;
  ctx.lineWidth = Math.max(1.5, cell * 0.1);
  ctx.beginPath();
  ctx.moveTo(px - s * 0.28, py - s * 0.28); ctx.lineTo(px + s * 0.28, py + s * 0.28);
  ctx.moveTo(px + s * 0.28, py - s * 0.28); ctx.lineTo(px - s * 0.28, py + s * 0.28);
  ctx.stroke();
}

function drawRobot(px, py, cell) {
  const t = THEMES[theme];
  const s = cell * 0.7;
  const x = px - s / 2, y = py - s * 0.42;
  ctx.strokeStyle = t.robotDark;
  ctx.lineWidth = Math.max(1, cell * 0.06);
  ctx.beginPath();
  ctx.moveTo(px, y);
  ctx.lineTo(px, y - cell * 0.26);
  ctx.stroke();
  ctx.fillStyle = t.robot;
  ctx.beginPath();
  ctx.arc(px, y - cell * 0.3, Math.max(1.5, cell * 0.09), 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = t.robot;
  ctx.strokeStyle = t.robotDark;
  ctx.lineWidth = Math.max(1, cell * 0.05);
  roundRectPath(ctx, x, y, s, s * 0.88, cell * 0.14);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = '#ffffff';
  const er = Math.max(1, cell * 0.07);
  ctx.beginPath();
  ctx.arc(px - s * 0.2, y + s * 0.3, er, 0, Math.PI * 2);
  ctx.arc(px + s * 0.2, y + s * 0.3, er, 0, Math.PI * 2);
  ctx.fill();
}

function drawPlayer(px, py, cell) {
  const t = THEMES[theme];
  const r = cell * 0.34;
  ctx.fillStyle = t.player;
  ctx.strokeStyle = t.playerDark;
  ctx.lineWidth = Math.max(1.5, cell * 0.06);
  ctx.beginPath();
  ctx.arc(px, py, r, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(px - r * 0.3, py - r * 0.3, r * 0.28, 0, Math.PI * 2);
  ctx.fill();
}

function draw(now) {
  const t = THEMES[theme];
  const cell = BASE_CELL * zoom;
  ctx.fillStyle = t.board;
  ctx.fillRect(0, 0, W, H);
  const vw = W / cell, vh = H / cell;
  const x0 = Math.floor(cam.x - vw / 2) - 1, x1 = Math.ceil(cam.x + vw / 2) + 1;
  const y0 = Math.floor(cam.y - vh / 2) - 1, y1 = Math.ceil(cam.y + vh / 2) + 1;
  if (cell >= 9) {
    ctx.strokeStyle = t.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = Math.max(0, x0); x <= Math.min(GRID_W, x1 + 1); x++) {
      const sx = (x - cam.x) * cell + W / 2;
      ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    }
    for (let y = Math.max(0, y0); y <= Math.min(GRID_H, y1 + 1); y++) {
      const sy = (y - cam.y) * cell + H / 2;
      ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    }
    ctx.stroke();
  }
  const sx = wx => (wx + 0.5 - cam.x) * cell + W / 2;
  const sy = wy => (wy + 0.5 - cam.y) * cell + H / 2;
  for (const k of wrecks) {
    const p = k.split(',');
    const wx = +p[0], wy = +p[1];
    if (wx < x0 || wx > x1 || wy < y0 || wy > y1) continue;
    drawWreck(sx(wx), sy(wy), cell);
  }
  for (const r of robots) {
    if (r.x < x0 || r.x > x1 || r.y < y0 || r.y > y1) continue;
    drawRobot(sx(r.x), sy(r.y), cell);
  }
  drawPlayer(sx(player.x), sy(player.y), cell);
  for (const p of particles) {
    const px = (p.x - cam.x) * cell + W / 2;
    const py = (p.y - cam.y) * cell + H / 2;
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(px, py, Math.max(1.5, p.size * cell), 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (shieldWave) {
    const tt = (now - shieldWave.start) / shieldWave.dur;
    if (tt >= 1) {
      shieldWave = null;
    } else {
      const ease = 1 - Math.pow(1 - tt, 3);
      const px = (player.x + 0.5 - cam.x) * cell + W / 2;
      const py = (player.y + 0.5 - cam.y) * cell + H / 2;
      ctx.strokeStyle = 'rgba(34,211,238,' + (0.9 * (1 - tt)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(2, cell * 0.35 * (1 - tt));
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.1, ease * 9 * cell), 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(59,130,246,' + (0.5 * (1 - tt)).toFixed(3) + ')';
      ctx.lineWidth = Math.max(1, cell * 0.15 * (1 - tt));
      ctx.beginPath();
      ctx.arc(px, py, Math.max(0.1, ease * 6 * cell), 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawMinimap() {
  const t = THEMES[theme];
  const mw = mmap.width, mh = mmap.height;
  const sx = mw / GRID_W, sy = mh / GRID_H;
  mctx.fillStyle = t.board;
  mctx.fillRect(0, 0, mw, mh);
  mctx.fillStyle = t.wreck;
  for (const k of wrecks) {
    const p = k.split(',');
    mctx.fillRect((+p[0]) * sx, (+p[1]) * sy, Math.max(1.5, sx), Math.max(1.5, sy));
  }
  mctx.fillStyle = t.robot;
  for (const r of robots) {
    mctx.fillRect(r.x * sx, r.y * sy, Math.max(2, sx * 1.4), Math.max(2, sy * 1.4));
  }
  const cell = BASE_CELL * zoom;
  const vw = W / cell, vh = H / cell;
  mctx.strokeStyle = t.view;
  mctx.lineWidth = 1.5;
  mctx.strokeRect(
    clamp((cam.x - vw / 2) * sx, 0, mw),
    clamp((cam.y - vh / 2) * sy, 0, mh),
    Math.min(mw, vw * sx),
    Math.min(mh, vh * sy)
  );
  mctx.fillStyle = t.player;
  mctx.beginPath();
  mctx.arc((player.x + 0.5) * sx, (player.y + 0.5) * sy, 3.5, 0, Math.PI * 2);
  mctx.fill();
  mctx.strokeStyle = '#ffffff';
  mctx.lineWidth = 1;
  mctx.stroke();
}

/* ---------- Boucle ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  cam.x += (player.x + 0.5 - cam.x) * Math.min(1, dt * 8);
  cam.y += (player.y + 0.5 - cam.y) * Math.min(1, dt * 8);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= (1 - 2 * dt);
    p.vy *= (1 - 2 * dt);
  }
  draw(now);
  drawMinimap();
  requestAnimationFrame(frame);
}

/* ---------- Init ---------- */
loadRecord();
try {
  const saved = localStorage.getItem(THEME_KEY);
  applyTheme(saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
} catch (e) {
  applyTheme('light');
}
fit();
reset();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
</script>
</body>
</html>
